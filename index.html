<!doctype html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="utf-8">
  <title>Topics - Planning Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@5.4.0/dist/govuk/govuk-frontend.min.css">
    <link rel="stylesheet" href="topic.css">
</head>
<body class="govuk-template__body">
  <a href="#main-content" class="govuk-skip-link">Skip to main content</a>
  <header class="govuk-header">
    <div class="govuk-header__container govuk-width-container">
      <a href="https://www.planning.data.gov.uk" class="govuk-header__link govuk-header__link--homepage">
        <span class="govuk-header__logotype-text">Planning Data</span>
      </a>
    </div>
  </header>
  <div class="govuk-width-container">
    <div class="govuk-phase-banner"><p class="govuk-phase-banner__content">
      <strong class="govuk-tag govuk-phase-banner__content__tag">Prototype</strong>
      <span class="govuk-phase-banner__text">Topic page prototype using data from planning.data.gov.uk</span></p></div>
    <main class="govuk-main-wrapper" id="main-content"><h1 class="govuk-heading-xl">Topics</h1>
    <p class="govuk-body-l">Browse planning data by topic.</p>
    <ul class="topic-list" id="topics"></ul>
    <p class="govuk-body" id="error" hidden></p>
    </div>
    </main>
  <footer class="govuk-footer"><div class="govuk-width-container"><span class="govuk-footer__licence-description">
    Prototype. Data © Crown copyright and database right, licensed under the Open Government Licence v3.0.</span></div></footer>
  <script>
    fetch("topics.json").then(r => r.json()).then(t => {
      const esc = s => String(s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
      document.getElementById("topics").innerHTML = Object.entries(t).map(([k, v]) =>
        '<li><h2 class="govuk-heading-m"><a class="govuk-link" href="topic.html?topic=' + esc(k) + '">' + esc(v.name) + '</a></h2><p class="govuk-body">' + esc(v.summary) + '</p></li>').join("");
    });
  </script>
</body>
</html>
